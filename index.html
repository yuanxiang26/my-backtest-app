<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>凱基隨身e策略 - Yahoo真實數據量化回測</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #121929;
      --panel-bg: #1a233a;
      --accent-blue: #1890ff;
      --accent-red: #ff4d4f;
      --accent-green: #52c41a;
      --accent-gold: #faad14;
      --text-main: #ffffff;
      --text-sub: #8c9ba5;
      --border-color: #26344d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      margin: 0; padding: 12px;
      display: flex; justify-content: center;
    }

    .app-container {
      width: 100%; max-width: 480px;
      background: var(--card-bg); border-radius: 12px;
      padding: 16px; border: 1px solid var(--border-color);
      box-sizing: border-box; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .top-nav { display: flex; background: var(--panel-bg); border-radius: 8px; padding: 3px; margin-bottom: 12px; }
    .nav-btn { flex: 1; text-align: center; padding: 8px 0; font-size: 13px; color: var(--text-sub); cursor: pointer; border-radius: 6px; }
    .nav-btn.active { background: var(--accent-blue); color: #fff; font-weight: bold; }

    .stock-input-box { display: flex; gap: 8px; margin-bottom: 12px; }
    .stock-input { flex: 1; background: var(--panel-bg); border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; }

    .selected-box { background: var(--panel-bg); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .cond-item { display: flex; justify-content: space-between; align-items: center; background: #101625; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }

    .tab-bar { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
    .tab-item { padding: 8px 0; font-size: 13px; color: var(--text-sub); cursor: pointer; flex: 1; text-align: center; position: relative; }
    .tab-item.active { color: var(--accent-blue); font-weight: bold; }
    .tab-item.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--accent-blue); }

    .cond-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .grid-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; font-size: 12px; text-align: center; cursor: pointer; }
    .grid-btn.selected { border-color: var(--accent-blue); background: #112a45; color: var(--accent-blue); }

    .opt-box { background: #101625; border: 1px dashed var(--accent-blue); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 12px; }
    .opt-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

    .backtest-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .control-select { background: var(--panel-bg); color: #fff; border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; font-size: 12px; outline: none; }
    .sub-controls { display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr; gap: 6px; margin-bottom: 12px; }
    .dir-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; text-align: center; cursor: pointer; }
    .dir-btn.active { background: var(--accent-blue); }
    .btn-exec { background: var(--accent-gold); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }

    .ai-card { background: linear-gradient(135deg, #112645 0%, #1a1a3a 100%); border: 1px solid var(--accent-blue); border-radius: 8px; padding: 12px; margin-bottom: 12px; display: none; }
    .report-box { background: var(--panel-bg); border-radius: 8px; padding: 12px; display: none; }
    .chart-container { height: 160px; width: 100%; margin-bottom: 12px; }
    .report-table { width: 100%; font-size: 12px; border-collapse: collapse; }
    .report-table td { padding: 5px 0; border-bottom: 1px solid var(--border-color); }
    .report-table td:last-child { text-align: right; font-weight: bold; }

    .stock-list { margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 12px; }
    .stock-row { display: flex; justify-content: space-between; align-items: center; background: #101625; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
    .stock-name { color: var(--accent-blue); cursor: pointer; font-weight: bold; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; width: 85%; max-width: 320px; padding: 16px; text-align: center; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-nav">
    <div class="nav-btn" onclick="setNav('kgi')">KGI選股</div>
    <div class="nav-btn" onclick="setNav('cond')">條件選股</div>
    <div class="nav-btn active" onclick="setNav('custom')">自訂選股</div>
  </div>

  <div class="stock-input-box">
    <input type="text" id="stockIdInput" class="stock-input" value="2330.TW" placeholder="輸入股票代碼 (例: 2330.TW, 2317.TW, 0050.TW)">
  </div>

  <div class="selected-box">
    <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 6px;" id="condSummary">已選 0 個條件</div>
    <div id="selectedCondList"></div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('tech')">技術</div>
    <div class="tab-item" onclick="switchTab('chip')">籌碼</div>
    <div class="tab-item" onclick="switchTab('base')">基本</div>
    <div class="tab-item" onclick="switchTab('rank')">排行</div>
  </div>

  <div id="condGrid" class="cond-grid"></div>

  <div class="opt-box">
    <div class="opt-row">
      <span>手續費折讓:</span>
      <select id="discountSelect" style="background:var(--panel-bg); color:#fff; border:none; border-radius:4px; padding:2px 4px; font-size:11px;">
        <option value="0.28">28折 (券商優惠)</option>
        <option value="0.60">6折 (一般折讓)</option>
        <option value="1.00">不折讓 (全額)</option>
      </select>
    </div>
  </div>

  <div class="backtest-controls">
    <select id="takeProfitSelect" class="control-select">
      <option value="0.05">停利5%</option>
      <option value="0.10">停利10%</option>
      <option value="0.15">停利15%</option>
      <option value="0.20">停利20%</option>
      <option value="999">不停利</option>
    </select>
    <select id="stopLossSelect" class="control-select">
      <option value="0.05">停損5%</option>
      <option value="0.10" selected>停損10%</option>
      <option value="0.15">停損15%</option>
      <option value="0.20">停損20%</option>
      <option value="999">不停損</option>
    </select>
    <select id="holdDaysSelect" class="control-select">
      <option value="1">持有1日</option>
      <option value="5">持有5日</option>
      <option value="10" selected>持有10日</option>
      <option value="20">持有20日</option>
      <option value="999">持續持有</option>
    </select>
  </div>

  <div class="sub-controls">
    <div id="btnLong" class="dir-btn active" onclick="setDirection('long')">多方</div>
    <div id="btnShort" class="dir-btn" onclick="setDirection('short')">空方</div>
    <select id="periodSelect" class="control-select">
      <option value="1y">近一年</option>
      <option value="2y">近兩年</option>
      <option value="3y">近三年</option>
      <option value="5y" selected>近五年</option>
    </select>
    <button class="btn-exec" id="btnExec" onclick="startYahooBacktest()">開始回測</button>
  </div>

  <div id="aiCard" class="ai-card">
    <div style="display:flex; justify-content:space-between; font-weight:bold; color:var(--accent-gold); margin-bottom:6px;">
      <span>🤖 AI 策略健康度診斷</span>
      <span id="aiScoreTag" style="background:var(--accent-gold); color:#000; padding:1px 6px; border-radius:4px;">評級: A</span>
    </div>
    <div id="aiReportText" style="font-size:12px; color:#d9d9d9; line-height:1.5;"></div>
  </div>

  <div id="reportBox" class="report-box">
    <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 4px;">Yahoo 真實報酬走勢 (已扣除交易成本)</div>
    <div class="chart-container">
      <canvas id="returnChart"></canvas>
    </div>
    <table class="report-table">
      <tr><td>交易次數</td><td id="resTrades">0</td></tr>
      <tr><td>勝率</td><td id="resWinRate" style="color:var(--accent-red);">0.00%</td></tr>
      <tr><td>總報酬率</td><td id="resTotalReturn" style="color:var(--accent-red);">0.00%</td></tr>
      <tr><td>平均報酬率</td><td id="resAvgReturn">0.00%</td></tr>
      <tr><td>最大獲利率</td><td id="resMaxWin" style="color:var(--accent-red);">0.00%</td></tr>
      <tr><td>最大連續獲利率</td><td id="resMaxSeqWin" style="color:var(--accent-red);">0.00%</td></tr>
      <tr><td>最大虧損率</td><td id="resMaxLoss" style="color:var(--accent-green);">0.00%</td></tr>
      <tr><td>最大連續虧損率</td><td id="resMaxSeqLoss" style="color:var(--accent-green);">0.00%</td></tr>
    </table>
  </div>

  <div class="stock-list">
    <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 6px;">符合策略個股 (點擊名稱下單 / 點擊價格看行情):</div>
    <div id="stockRows"></div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal-card" id="modalCard"></div>
</div>

<script src="app.js"></script>
</body>
</html>
